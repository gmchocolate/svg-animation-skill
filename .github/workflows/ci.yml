name: CI
on:
  push:
  pull_request:

jobs:
  python-and-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate bundled SVG
        run: python skills/svg-animation/scripts/check_svg.py --strict skills/svg-animation/examples/line-draw.svg
